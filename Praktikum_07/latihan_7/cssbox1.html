<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box 1 - Eko Muchamad Haryono</title>
</head>

<style>
    .container {
        display: flex;
    }

    .box1,
    .box2,
    .box3,
    .box4 {
        border: 2px solid black;

    }

    .box1 {
        background-color: #FFFF00	;
        height: 500px;
        margin-right: 20px;
        flex-grow: 1;;
    }

    .box2 {
        background-color: #ff7f00	;
        height: 500px;
        margin-right: 20px;
        flex-grow: 1;
    }

    .box3 {
        background-color: greenyellow	;
        height: 500px;
        margin-right: 20px;
        flex-grow: 1;
    }
    .box4 {
        background-color: #00FFFF		;
        height: 500px;
        margin-right: 20px;
        flex-grow: 1;
    }

</style>

<body>
    <!-- Class Container -->
    <div class="container">
        <!-- Class Box  -->
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <!-- Class Box  -->
    </div>
</body>

</html>
