<!DOCTYPE html>
<html>
  <head>
    <title>Form Entry Data Pegawai</title>
    <style>
      body {
        text-align: center;
      }
      /* CSS untuk navbar */
      .navbar {
        background-color: #333;
        overflow: hidden;
      }

      .navbar a {
        float: left;
        font-size: 16px;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
      }

      .navbar a:hover {
        background-color: #ddd;
        color: black;
      }

      /* CSS untuk form */
      form {
        margin: 20px;
      }

      label,
      input,
      select,
      textarea {
        display: inline-block;
        margin-bottom: 10px;
        vertical-align: top;
      }

      label {
        width: 120px;
        text-align: right;
        padding-right: 10px;
      }

      input,
      select,
      textarea {
        width: 250px;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <a href="#">Data Karyawan</a>
      <a href="#">Master Data</a>
      <a href="#">Tambah Data</a>
    </div>

    <h1>Form Entry Data Pegawai</h1>
    <form>
      <label for="nik">NIK:</label>
      <input type="text" id="nik" name="nik" required /><br />

      <label for="nama">Nama:</label>
      <input type="text" id="nama" name="nama" required /><br />

      <label for="tempat_lahir">Tempat Lahir:</label>
      <input type="text" id="tempat_lahir" name="tempat_lahir" required /><br />

      <label for="tanggal_lahir">Tanggal Lahir:</label>
      <input
        type="date"
        id="tanggal_lahir"
        name="tanggal_lahir"
        required
      /><br />

      <label for="alamat">Alamat:</label>
      <textarea id="alamat" name="alamat" rows="4" required></textarea><br />

      <label for="no_telepon">No Telepon:</label>
      <input type="text" id="no_telepon" name="no_telepon" required /><br />

      <label for="jabatan">Jabatan:</label>
      <select id="jabatan" name="jabatan" required>
        <option value="manager">Manager</option>
        <option value="staf">Staf</option>
        <option value="supervisor">Supervisor</option></select
      ><br />

      <label for="status">Status:</label>
      <select id="status" name="status" required>
        <option value="aktif">Aktif</option>
        <option value="tidak_aktif">Tidak Aktif</option></select
      ><br />

      <input type="submit" value="Simpan" />
      <input type="reset" value="Batal" />
    </form>
  </body>
</html>
