<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Halaman Web Profile - Eko Muchamad Haryono</title>

    <!-- CSS Internal -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .profile-container {
            display: flex;
            align-items: center;
            padding: 20px;
        }

        .profile-picture {
            width: 30%; /* Atur lebar gambar sesuai keinginan Anda */
            padding-right: 20px;  /* Atur jarak antara gambar dan teks */
        }

        .profile-picture img {
            width: 100%; /* Gambar akan mengisi seluruh lebar dari container .profile-picture */
            height: auto;
            border-radius: 50%;
        }

        .profile-description {
            width: 70%; /* Sisakan 70% lebar untuk teks */
            padding-left: 20px;
        }

        .profile-description h1 {
            width: 70%;
        }

        .profile-description p {
            font-size: 16px;
        }
    </style>
      <!-- CSS Internal -->

</head>

<body>
    <div class="profile-container">
        <div class="profile-picture">
            <img src="assets/img/profile_eko.jpg" alt="Foto_Profile">
