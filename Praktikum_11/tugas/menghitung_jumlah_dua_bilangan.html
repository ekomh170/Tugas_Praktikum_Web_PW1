<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menghitung Jumlah Dua Bilangan - Eko Muchamad Haryono</title>
    </head>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        h3 {
            margin: 30px;
            text-align: center;
            width: 100%;

        }

        .container {
            margin: 30px;
            padding: 10px;
            border: 2px solid;
        }


        .operasi {
            font-size: 20px;
            font-weight: bold;
        }
    </style>

    <body>

        <h3>Menghitung Jumlah Dua Bilangan</h3>

        <div class="container">
            <!-- Inputan Bilangan Pertama  -->
            <div>
                <label for="bil_pertama">Bilangan Pertama : <span></span></label>
                <input type="number" id="bil_pertama" placeholder="Masukan Bilangan Kedua" onChange="total_hasil()" />
                <br>
            </div>
            <!-- Inputan Bilangan Pertama  -->

            <!-- Operasi Hitung -->
            <div class="operasi">+</div>
            <!-- Operasi Hitung -->

            <!-- Inputan Bilangan Kedua  -->
            <div>
                <label for="bil_kedua">Bilangan Kedua : <span></span></label>
                <input type="number" id="bil_kedua" placeholder="Masukan Bilangan Kedua" onChange="total_hasil()" /><br>
                <!-- Inputan Bilangan Kedua  -->
            </div>

            <!-- Operasi Hitung -->
            <div class="operasi">=</div>
            <!-- Operasi Hitung -->

            <div>
                <label for="bil_kedua">Hasil Inputan : <span></span></label>
                <input type="number" id="hasil" disabled />
                <br><br>
            </div>
        </div>

        <!-- JS DOM - Manipulasi Data -->
        <script>
            function total_hasil() {

                // Menampung Input-an 
                let bil_pertama = parseFloat(document.getElementById("bil_pertama").value)
                let bil_kedua = parseFloat(document.getElementById("bil_kedua").value)

                // Validasi jika input pertama kosong, dianggap sebagai 0
                if (isNaN(bil_pertama)) {
                    bil_pertama = 0;
                }

                // Validasi jika input kedua kosong, dianggap sebagai 0
                if (isNaN(bil_kedua)) {
                    bil_kedua = 0;
                }

                // Hasil Operasi Hitung
                let total_bil = bil_pertama + bil_kedua

                // Mengubah Inputan Hasil Menjadi Total Bilangan
                document.getElementById("hasil").value = total_bil

            }
        </script>
        <!-- JS DOM - Manipulasi Data -->
    </body>

</html>
