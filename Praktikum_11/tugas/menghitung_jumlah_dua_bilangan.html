<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menghitung Jumlah Dua Bilangan - Eko Muchamad Haryono</title>
    </head>

      <!-- Favicon Lokal -->
      <link rel="shortcut icon" href="assets/favicon/sttnf.ico">
      <!-- Favicon Lokal -->

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        h3 {
            text-align: center;
            width: 100%;
        }

        .container {
            margin: 30px auto;
            padding: 10px;
            border: 2px solid #ddd;
            background-color: #fff;
            max-width: 400px;
        }

        .operasi {
            font-size: 25px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: calc(100% - 12px);
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .input_bil_1,
        .input_bil_2,
        .input_hasil_1 {
            margin-bottom: 5px;
        }
    </style>

    <body>

        <h3>Menghitung Jumlah Dua Bilangan</h3>

        <div class="container">
            <!-- Inputan Bilangan Pertama  -->
            <div class="input_bil_1">
                <label for="bil_pertama">Bilangan Pertama : <span></span></label>
                <input type="number" id="bil_pertama" placeholder="Masukan Bilangan Kedua" onChange="total_hasil()" />
            </div>
            <!-- Inputan Bilangan Pertama  -->

            <!-- Operasi Hitung -->
            <div class="operasi">+</div>
            <!-- Operasi Hitung -->

            <!-- Inputan Bilangan Kedua  -->
            <div class="input_bil_2">
                <label for="bil_kedua">Bilangan Kedua : <span></span></label>
                <input type="number" id="bil_kedua" placeholder="Masukan Bilangan Kedua" onChange="total_hasil()" />
                <!-- Inputan Bilangan Kedua  -->
            </div>

            <!-- Operasi Hitung -->
            <div class="operasi">=</div>
            <!-- Operasi Hitung -->

            <div class="input_hasil_1">
                <label for="bil_kedua">Hasil Inputan : <span></span></label>
                <input type="number" id="hasil" style="text-align: center; font-size: 30px;" disabled />
                <br><br>
            </div>
        </div>

        <!-- JS DOM - Manipulasi Data -->
        <script>
            function total_hasil() {

                // Menampung Input-an 
                let bil_pertama = parseFloat(document.getElementById("bil_pertama").value)
                let bil_kedua = parseFloat(document.getElementById("bil_kedua").value)

                // Validasi jika input pertama kosong, dianggap sebagai 0
                if (isNaN(bil_pertama)) {
                    bil_pertama = 0;
                }

                // Validasi jika input kedua kosong, dianggap sebagai 0
                if (isNaN(bil_kedua)) {
                    bil_kedua = 0;
                }

                // Hasil Operasi Hitung
                let total_bil = bil_pertama + bil_kedua

                // Mengubah Inputan Hasil Menjadi Total Bilangan
                document.getElementById("hasil").value = total_bil

            }
        </script>
        <!-- JS DOM - Manipulasi Data -->
    </body>

</html>
