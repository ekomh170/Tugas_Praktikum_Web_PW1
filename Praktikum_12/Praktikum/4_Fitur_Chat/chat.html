<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <title>Chat Messege - Eko Muchamad Haryono</title>

    <style>
      body,
      h1,
      h2,
      p,
      ul,
      li {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
      }

      /* Navbar */
      .navbar {
        background-color: #333;
        overflow: hidden;
      }

      .navbar a {
        float: left;
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
      }

      .navbar a.active {
        background-color: #ddd;
        color: black;
      }

      .navbar a:hover {
        background-color: #ddd;
        color: black;
      }

      /* Navbar */

      .container {
        margin: 30px;
        border: 3px solid black;
        text-align: center;
      }

      .chat-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .chat-box {
        width: 300px;
        background-color: #f2f2f2;
        border: 1px solid #ccc;
        padding: 10px;
        display: flex;
        flex-direction: column;
      }

      .chat-messages {
        flex: 1;
        max-height: 200px;
        overflow-y: auto;
        margin-bottom: 10px;
      }

      button {
        padding: 5px 10px;
        background-color: blue;
        color: white;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background-color: blue;
      }

      .pesan {
        background-color: #d9edf7;
        padding: 5px;
        margin: 5px 0;
        border-radius: 8px;
      }
    </style>

  </head>

  <!-- Favicon Lokal -->
  <link rel="shortcut icon" href="assets/img/favicon/sttnf.ico">
  <!-- Favicon Lokal -->

  <body>
    <div class="navbar">
      <a href="../../Tugas_12/1_Form_Validation/form_validation.html">Tugas Utama - Fitur Form Validation</a>
      <a href="../1_Fitur_Login/login.html">Fitur Login</a>
      <a href="../2_Fitur_Konversi/konversi.html">Fitur Konversi</a>
      <a href="../3_Fitur_Image_Picker/picker.html">Fitur Image Picker</a>
      <a href="../4_Fitur_Chat/chat.html" class="active">Fitur Chat</a>
    </div>

    <div class="container">
      <h1>Mekanisme Aplikasi Chat Box Pada JS</h1>
      <div class="chat-container">
        <div class="chat-box" id="kotakObrolan">
          <div class="pesan-obrolan" id="pesanObrolan"></div>
          <input onchange="kirimPesan()" type="text" id="inputPesan" placeholder="Tulis pesan..." />
          <button>Kirim</button>
        </div>
      </div>
    </div>

    <script>
      function kirimPesan() {
        let inputPesan = document.getElementById("inputPesan");
        let pesanObrolan = document.getElementById("pesanObrolan");

        let teksPesan = inputPesan.value;

        if (teksPesan.trim() !== "") {
          let pesanBaru = document.createElement("div");
          pesanBaru.textContent = teksPesan;
          pesanBaru.classList.add("pesan");

          pesanObrolan.appendChild(pesanBaru);
          pesanObrolan.scrollTop = pesanObrolan.scrollHeight;

          inputPesan.value = "";
        }
      }
    </script>
  </body>

</html>
