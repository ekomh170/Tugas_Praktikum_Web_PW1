<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <title>Image Picker - Eko Muchamad Haryono</title>

    <style>
      body,
      h1,
      h2,
      p,
      ul,
      li {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 0;
      }

      /* Navbar */
      .navbar {
        background-color: #333;
        overflow: hidden;
      }

      .navbar a {
        float: left;
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
      }

      .navbar a.active {
        background-color: #ddd;
        color: black;
      }

      .navbar a:hover {
        background-color: #ddd;
        color: black;
      }

      /* Navbar */

      .container {
        margin: 30px;
        border: 3px solid black;
        text-align: center;
      }

      .card {
        border: 1px solid #ccc;
        padding: 20px;
        margin-top: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      #gambarTerpilih {
        width: 300px;
      }
    </style>

  </head>

  <!-- Favicon Lokal -->
  <link rel="shortcut icon" href="assets/img/favicon/sttnf.ico">
  <!-- Favicon Lokal -->

  <body>
    <div class="navbar">
      <a href="../../Tugas_12/1_Form_Validation/form_validation.html">Tugas Utama - Fitur Form Validation</a>
      <a href="../1_Fitur_Login/login.html">Fitur Login</a>
      <a href="../2_Fitur_Konversi/konversi.html">Fitur Konversi</a>
      <a href="../3_Fitur_Image_Picker/picker.html" class="active">Fitur Image Picker</a>
      <a href="../4_Fitur_Chat/chat.html">Fitur Chat</a>
    </div>

    <div class="container">
      <h2>Image Picker</h2>
      <label for="pilihGambar">Pilih Gambar:</label>
      <select id="pilihGambar" onchange="tampilkanGambar()">
        <option value="gorila">Gorila</option>
        <option value="bison">Bison</option>
        <option value="gajah">Gajah</option>
        <option value="singa">Singa</option>
        <option value="zebra">Zebra</option>
      </select>
      <br />

      <div class="card">
        <img src="assets/img/foto1.png" id="gambarTerpilih" alt="Gambar Terpilih" />
      </div>
    </div>

    <script>
      function tampilkanGambar() {
        let nilaiTerpilih = document.getElementById("pilihGambar").value;
        let gambarTerpilih = document.getElementById("gambarTerpilih");

        // Menampilkan gambar sesuai dengan pilihan dropdown
        switch (nilaiTerpilih) {
          case "gorila":
            gambarTerpilih.src = "assets/img/foto1.png";
            break;
          case "bison":
            gambarTerpilih.src = "assets/img/foto2.png";
            break;
          case "gajah":
            gambarTerpilih.src = "assets/img/foto3.png";
            break;
          case "singa":
            gambarTerpilih.src = "assets/img/foto4.png";
            break;
          case "zebra":
            gambarTerpilih.src = "assets/img/foto5.png";
            break;
        }
      }
    </script>
  </body>

</html>
