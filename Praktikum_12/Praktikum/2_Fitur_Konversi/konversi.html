        <div class="container">
            <h2>Konversi Mata Uang ke Rupiah</h2>

            <table border="1">

                <!--  Baris 1 -->
                <tr>
                    <th>Masukan Nilai Uang</th>
                    <th>Jenis Uang</th>
                    <th>Nilai Rupiah</th>
                </tr>
                <!--  Baris 1 -->

                <!--  Baris 2 -->
                <tr>
                    <td>
                        <input type="number" id="nilai_uang" onchange="konversi_uang()" />
                    </td>
                    <td>
                        <select id="jenis_uang" onchange="konversi_uang()">
                            <option readonly>-- Pilih Uang --</option>
                            <option value="USD">Dollar US</option>
                            <option value="SGD">Dollar Singapore</option>
                            <option value="MYR">Ringgit Malaysia</option>
                            <option value="JPY">Yen Jepang</option>
                            <option value="EUR">Euro</option>
                            <option value="SAR">Riyal Arab Saudi</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" id="hasil_uang" readonly />
                    </td>
                </tr>
                <!--  Baris 2 -->
        </div>

        <script>
            function konversi_uang() {

                // Tangkap Data Nilai Uang, Jenis Uang
                let uang = document.getElementById("nilai_uang").value;
                let jenis = document.getElementById("jenis_uang").value;

                // Nilai Yang Akan Di Konversi
                nilaiTukar = 0;
                // Nilai Yang Akan Di Konversi

                // Mendapat Nilai Tukar Uang Berdasarkan Di Pilih
                switch (jenis) {
                    case "USD":
                        nilaiTukar = 9915;
                        break;
                    case "SGD":
                        nilaiTukar = 13472;
                        break;
                    case "MYR":
                        nilaiTukar = 874;
                        break;
                    case "JPY":
                        nilaiTukar = 120;
                        break;
                    case "EUR":
                        nilaiTukar = 15888
                        break;
                    case "SAR":
                        nilaiTukar = 3592;
                        break;
                    default:
                        nilaiTukar = 1;
                        break;
                }

                // Mendapat Nilai Tukar Uang Berdasarkan Di Pilih

                let hasilKonversi = uang * nilaiTukar;

                document.getElementById("hasil_uang").value = hasilKonversi

            }
        </script>
