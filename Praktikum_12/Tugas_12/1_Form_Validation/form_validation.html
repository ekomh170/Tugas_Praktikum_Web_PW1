<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form Validation</title>

        <style>
            body,
            h1,
            h2,
            p,
            ul,
            li {
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
                padding: 0;
            }

            /* Navbar */
            .navbar {
                background-color: #333;
                overflow: hidden;
            }

            .navbar a {
                float: left;
                display: block;
                color: white;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
            }

            .navbar a.active {
                background-color: #ddd;
                color: black;
            }

            .navbar a:hover {
                background-color: #ddd;
                color: black;
            }

            /* Navbar */

            .container {
                margin: 30px;
                border: 3px solid black;
                text-align: center;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }

            .error {
                color: red;
            }

            form {
                margin-top: 20px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
            }

            input {
                text-align: center;
                width: 100%;
                padding: 12px;
                margin-bottom: 20px;
                box-sizing: border-box;
                border: 1px solid #ccc;
                border-radius: 5px;
                transition: border-color 0.3s;
                font-size: 16px;
            }

            input.error {
                border-color: red;
            }

            input[type="submit"] {
                background-color: blue;
                color: white;
                cursor: pointer;
                font-size: 18px;
            }

            #result {
                margin-top: 20px;
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 5px;
                background-color: #f9f9f9;
                text-align: left;
            }

            #result p {
                margin-bottom: 10px;
                line-height: 1.5;
            }

            #result p:first-child {
                font-weight: bold;
                font-size: 1.2em;
            }
        </style>

    </head>

    <!-- Favicon Lokal -->
    <link rel="shortcut icon" href="assets/img/favicon/sttnf.ico">
    <!-- Favicon Lokal -->

    <body>
        <div class="navbar">
            <a href="form_validation.html" class="active">Tugas Utama - Fitur Form Validation</a>
            <a href="../../Praktikum/1_Fitur_Login/login.html">Fitur Login</a>
            <a href="../../Praktikum/2_Fitur_Konversi/konversi.html">Fitur Konversi</a>
            <a href="../../Praktikum/3_Fitur_Image_Picker/picker.html">Fitur Image Picker</a>
            <a href="../../Praktikum/4_Fitur_Chat/">Fitur Chat</a>
        </div>

        <div class="container">
            <h1>Form Validation <br>Tiket Bis Indonesia Sederhana</h1>
            <hr>
            <form id="myForm" onsubmit="return validateForm()">
                <label for="namaPelanggan">Nama Pelanggan:</label>
                <input type="text" id="namaPelanggan" name="namaPelanggan">
                <br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <br>

                <label for="jamKeberangkatan">Jam Keberangkatan:</label>
                <input type="time" id="jamKeberangkatan" name="jamKeberangkatan"
                    pattern="(?:[01]\d|2[0-3]):(?:[0-5]\d)">
                <br>

                <label for="tujuanKeberangkatan">Tujuan Keberangkatan:</label>
                <input type="text" id="tujuanKeberangkatan" name="tujuanKeberangkatan">
                <br>

                <label for="jumlahTiket">Jumlah Tiket:</label>
                <input type="number" id="jumlahTiket" name="jumlahTiket">
                <br>

                <input type="submit" value="Pesan Tiket">
            </form>

            <div id="result"></div>

        </div>

        <script>
            function validateForm() {
                var namaPelanggan = document.getElementById('namaPelanggan').value;
                var email = document.getElementById('email').value;
                var jamKeberangkatan = document.getElementById('jamKeberangkatan').value;
                var tujuanKeberangkatan = document.getElementById('tujuanKeberangkatan').value;
                var jumlahTiket = document.getElementById('jumlahTiket').value;

                var errorMessages = [];

                // Validasi Nama Pelanggan
                if (namaPelanggan.length === 0 || namaPelanggan.length > 30) {
                    errorMessages.push("Nama Pelanggan harus diisi dan maksimal 30 karakter.");
                    document.getElementById('namaPelanggan').classList.add('error');
                } else {
                    document.getElementById('namaPelanggan').classList.remove('error');
                }

                // Validasi Email
                var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    errorMessages.push("Format Email tidak valid.");
                    document.getElementById('email').classList.add('error');
                } else {
                    document.getElementById('email').classList.remove('error');
                }

                // Validasi Jam Keberangkatan
                var jamRegex = /^(?:[01]\d|2[0-3]):(?:[0-5]\d)$/;
                if (!jamRegex.test(jamKeberangkatan)) {
                    errorMessages.push("Format Jam Keberangkatan tidak valid. Gunakan format 00:00 - 23:59.");
                    document.getElementById('jamKeberangkatan').classList.add('error');
                } else {
                    document.getElementById('jamKeberangkatan').classList.remove('error');
                }

                // Validasi Tujuan Keberangkatan
                if (tujuanKeberangkatan.length === 0) {
                    errorMessages.push("Tujuan Keberangkatan harus diisi.");
                    document.getElementById('tujuanKeberangkatan').classList.add('error');
                } else {
                    document.getElementById('tujuanKeberangkatan').classList.remove('error');
                }

                // Validasi Jumlah Tiket
                if (jumlahTiket < 1 || jumlahTiket > 10 || isNaN(jumlahTiket)) {
                    errorMessages.push("Jumlah Tiket harus bilangan bulat antara 1 dan 10.");
                    document.getElementById('jumlahTiket').classList.add('error');
                } else {
                    document.getElementById('jumlahTiket').classList.remove('error');
                }

                // Validasi Tujuan Keberangkatan
                var kotaRegex = /^[A-Za-z\s]+$/;
                if (!kotaRegex.test(tujuanKeberangkatan)) {
                    errorMessages.push("Tujuan Keberangkatan harus berisi nama kota (huruf dan spasi).");
                    document.getElementById('tujuanKeberangkatan').classList.add('error');
                } else {
                    document.getElementById('tujuanKeberangkatan').classList.remove('error');
                }

                // Tampilkan pesan error atau hasil form
                var resultDiv = document.getElementById('result');
                if (errorMessages.length > 0) {
                    resultDiv.innerHTML = "<p class='error'>" + errorMessages.join("<br>") + "</p>";
                    return false; // Form tidak valid, jangan submit
                } else {
                    resultDiv.innerHTML = "<p>Data - Tiket Bis Indonesia :</p>" +
                        "<p><b>Nama Pelanggan : </b> " + namaPelanggan + "</p>" +
                        "<p><b>Email : </b> " + email + "</p>" +
                        "<p><b>Jam Keberangkatan : </b> " + jamKeberangkatan + "</p>" +
                        "<p><b>Tujuan Keberangkatan : </b> " + tujuanKeberangkatan + "</p>" +
                        "<p><b>Jumlah Tiket : </b> " + jumlahTiket + "</p>";
                    return false; // Form valid, jangan submit (untuk keperluan contoh ini)
                }
            }
        </script>

    </body>

</html>
